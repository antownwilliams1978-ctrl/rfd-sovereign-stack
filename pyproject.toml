[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfd-sovereign-stack"
version = "0.1.0"
description = "A sovereign, portable, and cost-effective e-commerce platform for the Red Feather Dynasty, built on a Vultr-ready headless architecture."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Red Feather Dynasty", email = "contact@rfd-core.org"}
]
keywords = [
    "e-commerce",
    "sovereign",
    "ai",
    "llm",
    "rag",
    "voice-agent",
    "headless"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "streamlit>=1.28.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "chromadb>=0.4.0",
    "vosk>=0.3.47",
    "sounddevice>=0.4.6",
    "numpy>=1.20",
    "requests>=2.28",
    "pyttsx3>=2.90",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/rfd-core/rfd-sovereign-stack"
Documentation = "https://github.com/rfd-core/rfd-sovereign-stack/docs"
Repository = "https://github.com/rfd-core/rfd-sovereign-stack.git"
Issues = "https://github.com/rfd-core/rfd-sovereign-stack/issues"

[tool.setuptools]
packages = ["sebek"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "sebek"
default_section = "THIRDPARTY"
include_trailing_comma = true
multi_line_mode = 3
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --strict-markers --cov=sebek --cov-report=term-local --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
]

[tool.coverage.run]
source = ["sebek"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 50
precision = 2
